[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramanujan"
version = "0.1.0"
description = "Ramanujan - an autonomous ML research engineer: a multi-agent system that plans, codes, runs, debugs and analyzes machine-learning experiments end to end."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhinav Pratap Singh" }]
keywords = ["agents", "llm", "automl", "gemini", "research", "multi-agent"]
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
demo = ["scikit-learn>=1.3"]
dev = ["pytest>=8.0", "scikit-learn>=1.3"]

[project.scripts]
ramanujan = "ramanujan.cli:app"

[tool.setuptools.packages.find]
include = ["ramanujan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
